<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MD ROM 启动器</title>
  <style>
    :root { --bg:#0b1020; --panel:#141b30; --line:#2a3658; --text:#e8edf7; --muted:#93a1c0; --gold:#f4c96b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
    .shell { height: 100%; display: flex; flex-direction: column; }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      background: linear-gradient(135deg, var(--panel), #1a2340);
      border-bottom: 1px solid var(--line);
    }
    .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--gold); color: #201503; font-weight: 800; font-size: 13px; }
    h1 { margin: 0; font-size: 15px; letter-spacing: .5px; white-space: nowrap; }
    .rom-name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--gold); }
    .actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .btn {
      touch-action: manipulation;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text);
      background: #263357;
      cursor: pointer;
    }
    .btn:hover { background: #30406b; }
    .hint { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .game-wrap { flex: 1 1 auto; min-height: 0; padding: 10px; }
    .game-wrap.dragover { outline: 2px dashed var(--gold); outline-offset: -8px; }
    #game { width: 100%; height: 100%; }
    #game > div { outline: none; }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var romParam = params.get('rom');
      var romUrl = romParam || './games/game.bin';
      var romName = romParam ? decodeURIComponent(romParam.split('/').pop() || romParam) : '梦幻模拟战2 帝国之路·暗灭';

      window.EJS_DEBUG_XX = true;
      window.EJS_player = '#game';
      window.EJS_core = 'segaMD';
      window.EJS_gameName = romName;
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = './vendor/ejs/';
      window.EJS_language = 'zh-CN';
      window.EJS_disableAutoLang = false;
      window.EJS_startOnLoaded = true;
      window.EJS_volume = 0.6;
      window.EJS_threads = false;
      window.EJS_gameID = 'md-rom-' + romName.replace(/[^\w\u4e00-\u9fa5]/g, '').slice(0, 40);
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">
        <span class="mark">MD</span>
        <h1>ROM 启动器</h1>
        <span id="romName" class="rom-name"></span>
      </div>
      <div class="actions">
        <span class="hint">方向键 / S=A / X=B / Z=C / Enter=Start / V=Mode · 可拖入 ROM</span>
        <button id="changeRomBtn" class="btn">换 ROM</button>
      </div>
    </header>
    <div id="gameWrap" class="game-wrap">
      <div id="game"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var nameEl = document.getElementById('romName');
      var btn = document.getElementById('changeRomBtn');
      var wrap = document.getElementById('gameWrap');

      if (nameEl) nameEl.textContent = window.EJS_gameName || '';

      function launchWith(url) {
        if (!url) return;
        location.href = location.href.split('?')[0] + '?rom=' + encodeURIComponent(url);
      }

      if (btn && window.romPicker) {
        btn.addEventListener('click', async function () {
          var url = await window.romPicker.select();
          launchWith(url);
        });
      }

      if (wrap && window.romPicker) {
        wrap.addEventListener('dragover', function (e) {
          e.preventDefault();
          wrap.classList.add('dragover');
        });
        wrap.addEventListener('dragleave', function () {
          wrap.classList.remove('dragover');
        });
        wrap.addEventListener('drop', function (e) {
          e.preventDefault();
          wrap.classList.remove('dragover');
          var file = e.dataTransfer.files && e.dataTransfer.files[0];
          if (!file) return;
          var filePath = window.romPicker.pathForFile(file);
          if (filePath) launchWith(window.romPicker.toFileUrl(filePath));
        });
      }
    });
  </script>
  <script src="./vendor/ejs/loader.js"></script>
</body>
</html>
