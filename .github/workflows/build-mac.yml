name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows x64 installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-rom-launcher-win-x64
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS x64 dmg and zip
        run: npm run dist:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-rom-launcher-mac-x64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor web assets
        run: npm run cap:sync

      - name: Build Android debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-rom-launcher-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: md-rom-launcher-win-x64
          path: release-assets/win

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: md-rom-launcher-mac-x64
          path: release-assets/mac

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: md-rom-launcher-android
          path: release-assets/android

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: v0.2.0
          body: |
            MD ROM Launcher — Windows x64 + macOS Intel x64 + Android

            - Windows: NSIS installer (.exe)
            - macOS: unsigned DMG (.dmg), right-click to open on first launch
            - Android: debug APK (.apk), minSdk 24 / Android 7.0
            - Built-in ROM: 梦幻模拟战2 帝国之路·暗灭
          files: |
            release-assets/win/*.exe
            release-assets/mac/*.dmg
            release-assets/android/*.apk
          fail_on_unmatched_files: true
